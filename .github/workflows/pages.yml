name: Deploy wiki to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: mkdocs build --strict

      - name: Confirm CNAME is in the built site
        run: grep -qx 'coloforniadreaming.info' site/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    # Tells Bing, Yandex, Seznam, Naver and other IndexNow engines that pages changed.
    # Google does not use IndexNow; it reads the sitemap submitted in Search Console.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Ping IndexNow with every URL in the sitemap
        continue-on-error: true
        run: |
          sleep 60
          URLS=$(curl -fsSL https://coloforniadreaming.info/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed -e 's/<loc>//' -e 's#</loc>##' | python3 -c 'import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          BODY=$(printf '{"host":"coloforniadreaming.info","key":"2dc6b6326ba9a0eec3196cfdf69c541d","keyLocation":"https://coloforniadreaming.info/2dc6b6326ba9a0eec3196cfdf69c541d.txt","urlList":%s}' "$URLS")
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$BODY"

